services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0-jammy
    container_name: test-genius-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: test-genius
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - test-genius-network

  # Backend Service
  backend:
    build: 
      context: ./Test-Genius-Backend
      dockerfile: Dockerfile
    container_name: test-genius-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/test-genius?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - PORT=5000
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-demo}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-demo}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo}
    depends_on:
      - mongodb
    networks:
      - test-genius-network

  # Frontend Service
  frontend:
    build: 
      context: ./Test-Genius-Frontend
      dockerfile: Dockerfile
    container_name: test-genius-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - test-genius-network

# Networks
networks:
  test-genius-network:
    driver: bridge

# Volumes
volumes:
  mongodb_data:
    driver: local
